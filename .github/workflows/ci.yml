name: CI

# push solo sobre master; las ramas las cubre pull_request. Con
# branches: ["**"] cada PR corría dos veces (una por el push a la rama, otra
# por el PR) sin agregar información.
on:
  push:
    branches: [master]
  pull_request:

# VERSIONES DE LAS ACTIONS: @v5 en checkout y setup-node, y el motivo no es
# "estar al día". v4 corre sobre Node 20, que GitHub ya deprecó: los runners lo
# fuerzan a Node 24 y cada corrida dejaba un warning en las cuatro jobs. La v5
# de las dos es la primera que corre sobre Node 24 de forma nativa.
#
# Requiere runner v2.327.1 o posterior. Los hosted de `ubuntu-latest` están muy
# por encima; anotarlo importa solo si algún día esto corre en un self-hosted.
#
# DOS CAMBIOS DE COMPORTAMIENTO DE v5 QUE SE VERIFICARON ANTES DE SUBIR, no se
# asumieron inocuos:
#
#   - checkout v5.1.0 trae un cambio BREAKING: por defecto se niega a traer el
#     código de un PR de un fork. Solo aplica a `pull_request_target` y a
#     `workflow_run`; este workflow dispara con `pull_request` y `push`, así
#     que no lo toca. Además GitHub retroportó esa protección a todas las
#     mayores soportadas —v4 incluida—, así que ya regía antes de este cambio.
#   - setup-node v5 cachea solo con detectar un campo `packageManager` en el
#     package.json. Ninguno de los dos paquetes lo tiene, y acá el cache se
#     declara explícito con `cache: npm` + `cache-dependency-path`, así que no
#     hay dos mecanismos compitiendo.
#
# Las dos actions ya van por v7. Quedarse en v5 es deliberado: resuelve el
# warning, sigue siendo una mayor soportada, y saltar dos mayores más es otra
# decisión con su propia verificación.

jobs:
  backend:
    name: Backend — typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Genera el cliente de Prisma a partir de schema.prisma; no requiere
      # conexión a una base de datos, así que corre sin infraestructura
      # externa.
      - run: npx prisma generate

      # Incluye tsconfig.test.json: los *.test.ts y *.integration-test.ts
      # también se typechequean, aunque los de integración no se ejecuten acá.
      # El build (tsconfig.json) los sigue excluyendo, así que dist/ no cambia.
      - run: npm run typecheck
      - run: npm run build

      # Solo *.test.ts (unitarios, sin DB). *.integration-test.ts requiere
      # DATABASE_URL/DIRECT_URL apuntando al Postgres alojado por Supabase
      # y queda fuera de CI — es la etapa 2 de ALTO-1, con su propio ciclo.
      #
      # CORS_ORIGIN es la única variable requerida por config/env.ts, y ese
      # módulo se evalúa al importar cualquier service (vía lib/prisma). Sin
      # esto, los tests fallan al importar, no al ejecutar. El valor es
      # irrelevante para lo que se prueba: ningún test unitario lo lee.
      - run: npm test
        env:
          CORS_ORIGIN: http://localhost:5173

      # Gate de vulnerabilidades de dependencias — hallazgo S-3 de
      # docs/review-ingesta-2026-08-27.md. Hasta acá el pipeline no miraba las
      # dependencias en absoluto: las dos vulnerabilidades que encontró ese
      # review aparecieron corriendo `npm audit` a mano.
      #
      # --omit=dev: lo que se despliega. Una vulnerabilidad en una herramienta
      # de build no está expuesta a nadie del lado del servidor, y meterla en el
      # mismo gate lo volvería ruidoso hasta que alguien lo apague.
      #
      # `|| true` es NECESARIO y no un atajo: `npm audit` sale con código 1 con
      # solo encontrar una vulnerabilidad de cualquier severidad, así que sin
      # esto el step moriría antes de que el gate pueda decidir. Quien decide es
      # scripts/audit-gate.ts, que falla ruidoso si el JSON no existe o no se
      # puede parsear — un `npm audit` que no corrió NO pasa por "todo limpio".
      - name: Auditoría de dependencias (bloquea high/critical sin excepción)
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          npm run audit:gate

  frontend:
    name: Frontend — typecheck, build, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # ---------------------------------------------------------------------------
  # BLOQUEANTE. Un fallo de ESLint o de Prettier corta el job y el merge, igual
  # que un typecheck roto.
  #
  # ARRANCÓ INFORMATIVO Y DEJÓ DE SERLO POR EVIDENCIA, no por confianza. Los
  # tres pasos llevaron `continue-on-error: true` durante exactamente una
  # corrida, porque lint y format:check solo habían corrido en una máquina
  # Windows con core.autocrlf=true — que es justamente lo que motivó
  # `endOfLine: "auto"` en .prettierrc. Un runner es un clon limpio en Ubuntu,
  # sin esa conversión: había que verlo antes de blindarlo.
  #
  # Ya se vio, en el PR de este mismo job. Las tres salidas del runner, leídas
  # del log y no del ícono verde —que con continue-on-error da success igual
  # aunque el paso falle—: `eslint .` sin una sola línea de salida en los dos
  # paquetes, y "All matched files use Prettier code style!" en Prettier. Cero
  # annotations de error. Sobre eso se sacan los continue-on-error.
  #
  # Job aparte y no pasos dentro de `backend`/`frontend`, por el mismo criterio
  # que ya separa a `integration`: es otro perfil de ejecución —cubre los dos
  # paquetes a la vez— y un fallo se lee como "estilo o reglas de lint", no como
  # "el backend está roto".
  #
  # SIN `npx prisma generate`, a diferencia de `backend` e `integration`: ninguna
  # de las dos configs de ESLint usa la variante con chequeo de tipos
  # (tseslint.configs.recommended, no recommendedTypeChecked), así que el linter
  # solo parsea y nunca necesita que el cliente de Prisma exista.
  #
  # UN SOLO setup-node con los dos lockfiles en cache-dependency-path, en vez de
  # dos pasos: el segundo setup-node volvería a instalar Node para nada — lo
  # único que aporta es la clave de caché, y esa opción acepta varias rutas.
  #
  # format:check corre UNA vez, desde la raíz: hay un solo .prettierrc para todo
  # el repo y `prettier --check .` desde acá ya baja a frontend/.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - run: npm ci
      - run: npm ci
        working-directory: frontend

      - name: ESLint (backend)
        run: npm run lint

      # Cubre backend y frontend de una: un solo .prettierrc en la raíz.
      - name: Prettier (todo el repo)
        run: npm run format:check

      - name: ESLint (frontend)
        run: npm run lint
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # Job aparte, no un paso más del job `backend`, por dos razones:
  #   1. Perfil de ejecución distinto — este levanta Docker y tarda minutos;
  #      `backend` da su veredicto en menos de un minuto. Separados corren en
  #      paralelo y el feedback rápido no queda detrás del lento.
  #   2. Un fallo acá se lee como "la base o la suite de integración", no como
  #      "el backend está roto".
  #
  # Levanta el stack local de Supabase con la CLI (Postgres + GoTrue reales, en
  # contenedores) en vez de un `postgres:16` pelado. Motivo: el esquema depende
  # de objetos que solo existen en un Postgres de Supabase — el trigger sobre
  # auth.users, auth.uid()/auth.role(), los roles anon/authenticated — y 6 de
  # los 8 archivos de integración necesitan además la Admin API de GoTrue
  # (admin.createUser, inviteUserByEmail, signInWithPassword), que ningún
  # bootstrap de SQL puede proveer.
  #
  # No usa credenciales de ningún proyecto real: el stack es local y sus claves
  # las emite la propia CLI en `supabase status`.
  # ---------------------------------------------------------------------------
  integration:
    name: Backend — migraciones + suite de integración (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # Versión fijada: es la misma con la que se generó supabase/config.toml.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # Producción firma los JWT con ES256 y publica el JWKS; src/lib/jwt.ts
      # verifica exactamente eso. Sin clave asimétrica el GoTrue local firmaría
      # HS256 y todo request autenticado daría 401 por el entorno. La clave es
      # efímera: se genera acá, vive lo que vive el runner y está en .gitignore.
      - name: Generar la clave de firma ES256 del GoTrue local
        run: npm run gen:signing-key

      # Se excluye todo lo que la suite no toca. Quedan postgres, gotrue (la
      # Admin API), kong (el gateway que gotrue expone en SUPABASE_URL) y
      # mailpit (destino SMTP local, necesario para inviteUserByEmail).
      - name: Levantar el stack local de Supabase
        run: |
          inicio=$(date +%s)
          supabase start \
            -x realtime,storage-api,imgproxy,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          echo "::notice title=supabase start::tardó $(( $(date +%s) - inicio ))s"

      # Los valores son locales (127.0.0.1) y no son secretos: se imprimen a
      # propósito para que, si la CLI cambia los nombres de las variables, el
      # log lo muestre en vez de fallar de forma opaca más abajo.
      - name: Exportar la conexión al entorno
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          cat "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          : "${API_URL:?supabase status no expuso API_URL — ver el volcado de arriba}"
          : "${DB_URL:?supabase status no expuso DB_URL — ver el volcado de arriba}"
          : "${ANON_KEY:?supabase status no expuso ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?supabase status no expuso SERVICE_ROLE_KEY}"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
            echo "DIRECT_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      # Objetivo con nombre propio, no efecto colateral de correr los tests:
      # que la base se reconstruya desde cero por el mismo camino que un
      # entorno real (migraciones + reaplicación del SQL manual), y que el
      # resultado se verifique objeto por objeto.
      - name: Reconstruir la base desde cero (migraciones + SQL manual)
        run: npm run migrate:deploy

      - name: Sembrar el catálogo de roles
        run: npm run prisma:seed
        env:
          CORS_ORIGIN: http://localhost:5173

      - name: Verificar que el esquema quedó completo
        run: npm run verify:schema

      - name: Suite de integración
        run: npm run test:integration
        env:
          CORS_ORIGIN: http://localhost:5173

      - name: Diagnóstico (solo si algo falló)
        if: failure()
        run: |
          supabase status || true
          docker ps -a
